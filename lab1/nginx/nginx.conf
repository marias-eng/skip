
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    upstream backend_pool {
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;
    }
    server {
        listen 80;
        server_name localhost daily.local second.local;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost daily.local;
        error_page 404 /404.html;

    location = /404.html {
        root C:/Users/admin/.vscode/DevOps/skip/lab1/frontend;
        internal;
    }

        ssl_certificate     C:/nginx/cert/cert.pem;
        ssl_certificate_key C:/nginx/cert/key.pem;

        location / {
            root C:/Users/admin/.vscode/DevOps/skip/lab1/frontend;
            index index.html;
        }

        location /api/ {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
            
            proxy_pass http://backend_pool/;
        }

        location /docs/ {
            alias C:/Users/admin/.vscode/DevOps/skip/lab1/docs/;
            index info.html;
        }
        
        location = /admin {
            auth_basic "Restricted Area";
            auth_basic_user_file C:/Users/admin/.vscode/nginx/conf/.htpassword;

            alias C:/Users/admin/.vscode/DevOps/skip/lab1/frontend/admin.html;
        }
    }

    server {
        listen 443 ssl;
        server_name second.local;

        ssl_certificate     C:/nginx/cert/cert.pem;
        ssl_certificate_key C:/nginx/cert/key.pem;

        location / {
            default_type text/plain;
            return 200 "Это второй виртуальный хост";
        }    
    }
